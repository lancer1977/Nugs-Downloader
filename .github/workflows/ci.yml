name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: nugs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Restore
      run: dotnet restore csharp/NugsDownloader.sln

    - name: Test
      run: dotnet test csharp/NugsDownloader.sln --no-restore -m:1 -p:UseSharedCompilation=false --logger 'console;verbosity=minimal'

    - name: Vulnerability check
      run: dotnet list csharp/NugsDownloader.sln package --vulnerable --include-transitive

    - name: Build
      run: dotnet build csharp/NugsDownloader.sln --no-restore -m:1

  container:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build container image
      run: docker build -f deploy/portainer/r620/Dockerfile -t ghcr.io/lancer1977/nugs-downloader-web:${{ github.sha }} .

    - name: Log in to GHCR
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push immutable image tag
      if: github.event_name == 'push'
      run: docker push ghcr.io/lancer1977/nugs-downloader-web:${{ github.sha }}

    - name: Print image digest
      if: github.event_name == 'push'
      run: docker buildx imagetools inspect ghcr.io/lancer1977/nugs-downloader-web:${{ github.sha }}
