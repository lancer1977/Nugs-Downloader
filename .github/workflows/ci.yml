name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: nugs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 10.0.x

    - name: Verify CI permission policy
      run: scripts/test-ci-policy.sh

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Restore
      run: dotnet restore csharp/NugsDownloader.sln

    - name: Test
      run: dotnet test csharp/NugsDownloader.sln --no-restore -m:1 -p:UseSharedCompilation=false --logger 'console;verbosity=minimal'

    - name: Vulnerability check
      run: dotnet list csharp/NugsDownloader.sln package --vulnerable --include-transitive

    - name: Build
      run: dotnet build csharp/NugsDownloader.sln --no-restore -m:1

  container:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Build container image
      run: docker build -f deploy/portainer/r620/Dockerfile -t ghcr.io/lancer1977/nugs-downloader-web:${{ github.sha }} .

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: [test, container]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Build container image
      run: docker build -f deploy/portainer/r620/Dockerfile -t ghcr.io/lancer1977/nugs-downloader-web:${{ github.sha }} .

    - name: Log in to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push immutable image tag
      run: docker push ghcr.io/lancer1977/nugs-downloader-web:${{ github.sha }}

    - name: Print image digest
      run: docker buildx imagetools inspect ghcr.io/lancer1977/nugs-downloader-web:${{ github.sha }}
